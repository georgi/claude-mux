[package]
name = "cmux"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
cmux-core = { path = "../cmux-core" }
cmux-proto = { path = "../cmux-proto" }
libc = "0.2.190"
portable-pty = "0.9.0"
ratatui = "0.30"
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.4.5"
toml = "1.1.8"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2.2"
ureq = "3.4.2"
uuid.workspace = true
vt100.workspace = true

[dev-dependencies]
cmuxd = { path = "../cmuxd" }
insta = "1.49.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }

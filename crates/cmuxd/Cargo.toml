[package]
name = "cmuxd"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
cmux-core = { path = "../cmux-core" }
cmux-proto = { path = "../cmux-proto" }
cmux-history = { path = "../cmux-history" }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
libc = "0.2.191"
portable-pty = "0.9.0"
qrcode = "0.14.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17.14"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "fs", "process"] }
toml = "1.1.8"
url = "2"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1.44"
uuid.workspace = true
vt100.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"], optional = true }

[features]
default = ["web"]
# The web app (web/dist/, built with `npm run build`) embedded and served at
# `/`. Without a build, `/` serves a placeholder page; see src/api/web.rs.
web = ["dep:rust-embed"]
# Built-in TLS for the TCP listener (rustls). Off by default; see src/tls.rs.
tls = ["dep:axum-server"]
axum-server = ["dep:axum-server"]

[dev-dependencies]
tokio-tungstenite = "0.29.0"
http-body-util = "0.1.5"
insta = "1.49.0"
libc = "0.2.191"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
